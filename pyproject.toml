[project]
name = "gpy"
version = "1.15.0"
description = "The Gaussian Process Toolbox"
authors = [{ name = "GPy Authors", email = "gpy.authors@gmail.com" }]
# soupsieve 4.x (GHSA-mmhr-3c5m-f64f) requires Python >=3.11.5. Older 3.11
# patches can only resolve the vulnerable 2.10 pin via nbconvert.
requires-python = ">=3.11.5,<4"
readme = "README.md"
license = "BSD-3-Clause"
keywords = [
    "machine-learning",
    "gaussian-processes",
    "kernels",
]
dependencies = [
    "numpy>=2.4.6",
    "six",
    "decorator",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
docs = ["sphinx"]
optional = [
    "mpi4py",
    "ipython>=9.18.1",
]
plotting = [
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
]
notebook = [
    "jupyter_client>=8.10.0",
    "ipywidgets>=8.1.9",
    "ipykernel>=7.4.0",
    "notebook>=7.6.5",
]
tables = ["tables>=3.11.1"]

[project.urls]
Homepage = "https://sheffieldml.github.io/GPy/"
Repository = "https://github.com/SheffieldML/GPy"
Documentation = "https://gpy.readthedocs.io/"

[tool.poetry]
packages = [{ include = "GPy" }]
include = [
    "GPy/**/*.json",
    "GPy/defaults.cfg",
    "GPy/installation.cfg",
    "LICENSE.txt",
    "AUTHORS.txt",
]
# Dead Python 2 trees must not ship in the wheel (#1251). Runtime is already >=3.11.
exclude = [
    "GPy/old_tests",
    "GPy/kern/src/todo",
    "GPy/testing/mpi_test__.py",
]

# CIP-000E Phase 2: pure-Python package — Cython Extension build hook removed.

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "pods>=0.1.19",
    "ruff==0.17.5",
    "pytest-cov>=7.1.0",
]

# uv installs the `dev` group by default; extras stay opt-in via --extra.
[tool.uv]
default-groups = ["dev"]

[build-system]
requires = [
    "poetry-core>=1.8.0",
]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "build",
    "dist",
    ".eggs",
]

[tool.ruff.lint]
# CIP-0005: pyflakes + bugbear + full SIM + pyupgrade (partial) + safe pycodestyle.
# Format enforced in CI. Deferred: UP008 (paramz).
# CIP-000F Stage 0: TID251 bans direct paramz imports outside the façade.
select = [
    "E9",
    "F",
    "B010",
    "B011",
    "B013",
    "B016",
    "B018",
    "B028",
    "B904",
    "B007",
    "B905",
    "B006",
    "B026",
    "B023",
    "SIM",
    "UP004",
    "UP009",
    "UP010",
    "UP015",
    "UP018",
    "UP024",
    "UP029",
    "UP034",
    "UP030",
    "UP035",
    "UP036",
    "UP032",
    "UP031",
    "E401",
    "E711",
    "E712",
    "E713",
    "E714",
    "W291",
    "W293",
    "TID251",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"paramz".msg = "Import paramz only via GPy.core.parameterization (CIP-000F Stage 0)"
"paramz.caching".msg = "Import caching via GPy.core.parameterization.caching (CIP-000F Stage 0)"
"paramz.transformations".msg = "Import transformations via GPy.core.parameterization.transformations (CIP-000F Stage 0)"
"paramz.domains".msg = "Import domains via GPy.core.parameterization.domains (CIP-000F Stage 0)"
"paramz.core".msg = "Import paramz.core only inside GPy.core.parameterization (CIP-000F Stage 0)"
"paramz.parameterized".msg = "Import via GPy.core.parameterization (CIP-000F Stage 0)"
"paramz.optimization".msg = "Import via GPy.inference.optimization (CIP-000F Stage 0)"

[tool.ruff.lint.per-file-ignores]
# Public API re-exports (from .foo import Bar) are intentional in package inits.
"**/__init__.py" = ["F401"]
# CIP-000F: only the parameterization façade may import paramz directly
# (optimisation was vendored in Stage 1).
"GPy/core/parameterization/**" = ["TID251"]

[tool.pytest.ini_options]
# #1210: keep suite readable; silence known third-party noise only.
filterwarnings = [
    "ignore:Passing unrecognized arguments to super\\(HTML\\):DeprecationWarning",
]
markers = [
    "numerical: adversarial / extreme-input numerical stability (CIP-0011)",
]

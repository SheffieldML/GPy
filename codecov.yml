codecov:
  branch: devel

coverage:
  precision: 2
  round: down
  range: "40...100"

  status:
    # Informational until a post-GHA baseline is trusted; do not block merges on %.
    project:
      default:
        target: auto
        informational: true
        if_no_uploads: success

    patch:
      default:
        informational: true
        if_no_uploads: success

    changes: false

comment:
  layout: "header, diff, flags"
  behavior: default

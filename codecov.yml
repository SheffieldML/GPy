codecov:
  # Default branch for the badge / compare baseline (CIP-0008 rename).
  branch: main

coverage:
  precision: 2
  round: down
  range: "40...100"

  status:
    # Project: track relative to auto baseline; do not block merges.
    project:
      default:
        target: auto
        informational: true
        if_no_uploads: success

    # Patch: soft 50% target after CIP-0009 Slice A/B (plotting + util).
    # informational: true keeps GitHub checks green while Codecov still
    # flags thin patches (the #1229 ~4% hole) in the PR comment.
    patch:
      default:
        target: 50%
        informational: true
        if_no_uploads: success

    changes: false

comment:
  layout: "header, diff, flags"
  behavior: default

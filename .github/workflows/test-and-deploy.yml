name: "Test Python Lib"
on:
  push:
    branches:
      - main
      - devel
      - deploy
  pull_request:
  release:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.1.3"
          poetry --version
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install lib (Poetry, with Cython build)
        run: poetry install --with dev --no-interaction

      - name: Smoke-import Cython extensions
        run: |
          poetry run python -c "from GPy.kern.src import stationary_cython; from GPy.util import choleskies_cython, linalg_cython; from GPy.kern.src import coregionalize_cython; from GPy.models import state_space_cython; print('cython ok')"

      - name: pytest
        run: poetry run pytest GPy/testing

  # Single-matrix coverage upload (informational). Full OS/Python matrix stays bare pytest.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.1.3"
          poetry --version
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install lib (Poetry, with Cython build)
        run: poetry install --with dev --no-interaction

      - name: pytest with coverage
        run: poetry run pytest GPy/testing --cov=GPy --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: ubuntu-3.12
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # CIP-0005 Phase 4: fail CI on configured ruff check and format.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install 'ruff==0.9.10'

      - name: Ruff check (select from pyproject.toml)
        run: ruff check GPy --exclude GPy/old_tests --exclude GPy/testing/mpi_test__.py

      - name: Ruff format
        run: ruff format --check GPy

  build:
    if: github.event_name == 'release'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.1.3"
          poetry --version
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Build wheel and sdist
        run: poetry build

      - name: List contents of dist
        run: ls -R dist

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-${{ matrix.os }}-${{ matrix.python }}
          path: dist

  build-linux:
    if: github.event_name == 'release'
    strategy:
      matrix:
        python: ['cp311-cp311', 'cp312-cp312', 'cp313-cp313', 'cp314-cp314']
        # x86_64 + aarch64 (#1114 / #1209). aarch64 uses native ARM runners.
        platform:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.platform.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # manylinux2014 ships GCC 10.2.1; NumPy 2.5+ requires GCC >= 10.3 and
      # no longer provides usable manylinux2014 wheels, so pip tries (and fails)
      # to build NumPy from source there. manylinux_2_28 has a new enough toolchain.
      - name: Build and repair wheel in manylinux container
        run: |
          docker run --rm \
            -v "$PWD":/io \
            -w /io \
            ${{ matrix.platform.image }} \
            bash -euo pipefail -c "
              PY=/opt/python/${{ matrix.python }}/bin/python
              \"\$PY\" -m pip install --upgrade pip
              \"\$PY\" -m pip install poetry==2.1.3
              # Prefer binary NumPy wheels; never fall back to a source build.
              \"\$PY\" -m pip install --only-binary=:all: 'numpy>=2,<3'
              \"\$PY\" -m poetry build -f wheel
              \"\$PY\" -m pip install auditwheel
              \"\$PY\" -m auditwheel repair dist/*${{ matrix.python }}-linux_*.whl
              rm -f dist/*
              mv wheelhouse/* dist/
              rmdir wheelhouse
            "
          sudo chown -R "$USER:$USER" dist

      - name: List contents of dist
        run: ls -R dist

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-manylinux-${{ matrix.platform.arch }}-${{ matrix.python }}
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build-linux, build]
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install twine
        run: |
          pip install --upgrade pip
          pip install twine

      - name: Download all artifacts to a specific directory
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List and verify artifact integrity
        run: |
          echo "Contents of dist directory:"
          ls -lhR dist

          for file in dist/*.tar.gz; do
            if [ -f "$file" ]; then
              echo "Verifying $file..."
              tar -tzf "$file" > /dev/null && echo "✓ $file is valid" || echo "✗ $file is corrupted"
            fi
          done

      - name: Inspect wheel files
        run: |
          ls -R dist

      - name: Verify distributions
        run: twine check dist/*

      - name: Upload to PyPI using twine
        run: twine upload dist/*

# CIP-0005: optional local hooks. CI fails on the same ruff check select
# as pyproject.toml. Format remains advisory (do not require --check in CI yet).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--no-fix]
      - id: ruff-format
        types_or: [python, pyi]

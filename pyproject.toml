[project]
name = "gpy"
version = "1.15.0"
description = "The Gaussian Process Toolbox"
authors = [{ name = "GPy Authors", email = "gpy.authors@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "BSD-3-Clause"
keywords = [
    "machine-learning",
    "gaussian-processes",
    "kernels",
]
dependencies = [
    "numpy>=2",
    "six",
    "paramz>=0.9.6",
    "scipy>=1.3.0",
]

[project.optional-dependencies]
docs = ["sphinx"]
optional = [
    "mpi4py",
    "ipython>=4.0.0",
]
plotting = [
    "matplotlib>=3.4",
    "plotly>=7.1.0",
]
notebook = [
    "jupyter_client>=4.0.6",
    "ipywidgets>=4.0.3",
    "ipykernel>=4.1.0",
    "notebook>=4.0.5",
]
tables = ["tables>=3.9.0"]

[project.urls]
Homepage = "https://sheffieldml.github.io/GPy/"
Repository = "https://github.com/SheffieldML/GPy"
Documentation = "https://gpy.readthedocs.io/"

[tool.poetry]
packages = [{ include = "GPy" }]
include = [
    "GPy/**/*.json",
    "GPy/defaults.cfg",
    "GPy/installation.cfg",
    "GPy/**/*.h",
    "GPy/**/*.pyx",
    "GPy/**/*.pxd",
    "LICENSE.txt",
    "AUTHORS.txt",
]
# Dead Python 2 trees must not ship in the wheel (#1251). Runtime is already >=3.11.
exclude = [
    "GPy/old_tests",
    "GPy/kern/src/todo",
    "GPy/testing/mpi_test__.py",
]

# CIP-000C: retain Poetry build hook for Cython until a follow-on backend cutover.
[tool.poetry.build]
script = "build_extension.py"
generate-setup-file = true  # required for Cython build script / ext_modules

[dependency-groups]
dev = [
    "matplotlib>=3.4",
    "pytest>=8.0",
    "pods>=0.1.14",
    "ruff==0.17.4",
    "pytest-cov>=5.0",
]

# uv installs the `dev` group by default; extras stay opt-in via --extra.
[tool.uv]
default-groups = ["dev"]

[build-system]
requires = [
    "poetry-core>=1.8.0",
    "setuptools",
    "wheel",
    "numpy>=2",
    "Cython>=0.29",
    "scipy>=1.3.0",
]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "build",
    "dist",
    ".eggs",
]

[tool.ruff.lint]
# CIP-0005: pyflakes + bugbear + full SIM + pyupgrade (partial) + safe pycodestyle.
# Format enforced in CI. Deferred: UP008 (paramz).
select = [
    "E9",
    "F",
    "B010",
    "B011",
    "B013",
    "B016",
    "B018",
    "B028",
    "B904",
    "B007",
    "B905",
    "B006",
    "B026",
    "B023",
    "SIM",
    "UP004",
    "UP009",
    "UP010",
    "UP015",
    "UP018",
    "UP024",
    "UP029",
    "UP034",
    "UP030",
    "UP035",
    "UP036",
    "UP032",
    "UP031",
    "E401",
    "E711",
    "E712",
    "E713",
    "E714",
    "W291",
    "W293",
]

[tool.ruff.lint.per-file-ignores]
# Public API re-exports (from .foo import Bar) are intentional in package inits.
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
# #1210: keep suite readable; silence known third-party noise only.
filterwarnings = [
    "ignore:Passing unrecognized arguments to super\\(HTML\\):DeprecationWarning",
]

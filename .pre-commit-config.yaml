# CIP-0005: optional local hooks matching CI (ruff check + ruff format).
# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--no-fix]
      - id: ruff-format
        types_or: [python, pyi]

[tool.poetry]
name = "gpy"
version = "1.14.2"
description = "The Gaussian Process Toolbox"
authors = ["GPy Authors <gpy.authors@gmail.com>"]
license = "BSD-3-Clause"
readme = "README.md"
homepage = "https://sheffieldml.github.io/GPy/"
repository = "https://github.com/SheffieldML/GPy"
documentation = "https://gpy.readthedocs.io/"
keywords = ["machine-learning", "gaussian-processes", "kernels"]
packages = [{ include = "GPy" }]
include = [
    "GPy/**/*.json",
    "GPy/defaults.cfg",
    "GPy/installation.cfg",
    "GPy/**/*.h",
    "GPy/**/*.pyx",
    "GPy/**/*.pxd",
    "LICENSE.txt",
    "AUTHORS.txt",
]

[tool.poetry.build]
script = "build_extension.py"
generate-setup-file = false

[tool.poetry.dependencies]
python = ">=3.9,<4"
numpy = ">=2"
six = "*"
paramz = ">=0.9.6"
scipy = ">=1.3.0"
tables = { version = ">=3.9.0", optional = true }
sphinx = { version = "*", optional = true }
mpi4py = { version = "*", optional = true }
ipython = { version = ">=4.0.0", optional = true }
matplotlib = { version = ">=3.4", optional = true }
plotly = { version = ">=1.8.6", optional = true }
jupyter_client = { version = ">=4.0.6", optional = true }
ipywidgets = { version = ">=4.0.3", optional = true }
ipykernel = { version = ">=4.1.0", optional = true }
notebook = { version = ">=4.0.5", optional = true }

[tool.poetry.extras]
docs = ["sphinx"]
optional = ["mpi4py", "ipython"]
plotting = ["matplotlib", "plotly"]
notebook = ["jupyter_client", "ipywidgets", "ipykernel", "notebook"]
tables = ["tables"]

[tool.poetry.group.dev.dependencies]
matplotlib = ">=3.4"
pytest = ">=8.0"
pods = ">=0.1.14"
ruff = "0.9.10"

[build-system]
requires = [
    "poetry-core>=1.8.0",
    "setuptools",
    "wheel",
    "numpy>=2",
    "Cython>=0.29",
    "scipy>=1.3.0",
]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "build",
    "dist",
    ".eggs",
    "GPy/kern/src/todo",
]

[tool.ruff.lint]
select = ["E9", "F821"]
